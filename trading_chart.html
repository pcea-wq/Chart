<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pablo's Trading Chart</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  // Fallback: si jsdelivr falla, intentamos unpkg
  if (typeof LightweightCharts === 'undefined') {
    document.write('<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>');
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-right: 12px;
    border-right: 1px solid #30363d;
  }
  .group:last-child { border-right: none; }
  label {
    font-size: 11px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select, button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  select:hover, button:hover { background: #30363d; }
  button.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }
  button.freeze.active {
    background: #d29922;
    border-color: #d29922;
    color: #0d1117;
  }
  button.replay.active {
    background: #238636;
    border-color: #238636;
    color: white;
  }
  .tf-group button {
    padding: 6px 8px;
    min-width: 36px;
    font-size: 12px;
  }
  .price-display {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .price {
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .price.up { color: #3fb950; }
  .price.down { color: #f85149; }
  .status {
    font-size: 11px;
    color: #8b949e;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3fb950;
    animation: pulse 2s infinite;
  }
  .dot.frozen { background: #d29922; animation: none; }
  .dot.replay { background: #238636; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  #chart {
    flex: 1;
    position: relative;
  }
  .replay-controls {
    display: none;
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 8px 16px;
    align-items: center;
    gap: 10px;
  }
  .replay-controls.visible { display: flex; }
  .replay-controls button {
    padding: 4px 12px;
    min-width: 40px;
  }
  .speed-btn { font-size: 11px; }
  .replay-info {
    margin-left: auto;
    font-size: 12px;
    color: #8b949e;
    font-variant-numeric: tabular-nums;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #21262d;
    border: 1px solid #30363d;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="group">
    <label>Par</label>
    <select id="symbol">
      <option value="BTC_USDT">BTC/USDT.P</option>
      <option value="ETH_USDT">ETH/USDT.P</option>
      <option value="BNB_USDT">BNB/USDT.P</option>
      <option value="XRP_USDT">XRP/USDT.P</option>
      <option value="HYPE_USDT">HYPE/USDT.P</option>
      <option value="DOGE_USDT">DOGE/USDT.P</option>
      <option value="TRX_USDT">TRX/USDT.P</option>
      <option value="BCH_USDT">BCH/USDT.P</option>
      <option value="ZEC_USDT">ZEC/USDT.P</option>
      <option value="LINK_USDT">LINK/USDT.P</option>
      <option value="RAY_USDT">RAY/USDT.P</option>
      <option value="AVAX_USDT">AVAX/USDT.P</option>
    </select>
  </div>

  <div class="group tf-group">
    <label>TF</label>
    <button data-tf="10s">10s</button>
    <button data-tf="30s">30s</button>
    <button data-tf="Min1" class="active">1m</button>
    <button data-tf="Min5">5m</button>
    <button data-tf="Min15">15m</button>
    <button data-tf="Min30">30m</button>
    <button data-tf="Min60">1h</button>
    <button data-tf="Hour4">4h</button>
    <button data-tf="Day1">1D</button>
  </div>

  <div class="group">
    <button id="freezeBtn" class="freeze" title="Congela el precio para refinar entradas sin que el mercado mueva el chart">❄ Freeze</button>
    <button id="replayBtn" class="replay" title="Bar Replay - avanza vela por vela">▶ Replay</button>
  </div>

  <div class="price-display">
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">LIVE</span>
    </div>
    <div class="price" id="priceDisplay">—</div>
  </div>
</div>

<div id="chart"></div>

<div class="replay-controls" id="replayControls">
  <button id="replayPlay">▶</button>
  <button id="replayStep">⏭</button>
  <button id="replayReset">⏮</button>
  <label style="margin-left:10px;">Velocidad:</label>
  <button class="speed-btn" data-speed="2000">0.5x</button>
  <button class="speed-btn active" data-speed="1000">1x</button>
  <button class="speed-btn" data-speed="500">2x</button>
  <button class="speed-btn" data-speed="250">4x</button>
  <button class="speed-btn" data-speed="100">10x</button>
  <button id="replayExit" style="margin-left:10px;">✕ Salir</button>
  <div class="replay-info" id="replayInfo">—</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// VERIFICAR LIBRERÍA
// ============================================================
if (typeof LightweightCharts === 'undefined') {
  document.body.innerHTML = `
    <div style="padding:40px;text-align:center;color:#f85149;font-family:sans-serif;">
      <h2>Error cargando librería</h2>
      <p>No se pudo cargar Lightweight Charts desde el CDN.</p>
      <p>Soluciones:</p>
      <ol style="text-align:left;display:inline-block;color:#c9d1d9;">
        <li>Verifica tu conexión a internet</li>
        <li>Desactiva bloqueadores de anuncios para este archivo</li>
        <li>Intenta abrir el archivo con otro browser (Chrome, Edge, Firefox)</li>
      </ol>
    </div>`;
  throw new Error('LightweightCharts no cargó');
}

// ============================================================
// ESTADO GLOBAL
// ============================================================
const state = {
  symbol: 'BTC_USDT',
  interval: 'Min1',
  candles: [],
  liveCandles: [],      // candles para freeze mode (lo que está pasando "ahora")
  isFrozen: false,
  isReplay: false,
  replayIndex: 0,
  replayTimer: null,
  replaySpeed: 1000,
  pollTimer: null,
  lastPrice: 0,
  prevPrice: 0,
};

// MEXC intervals nativos
const MEXC_INTERVALS = ['Min1','Min5','Min15','Min30','Min60','Hour4','Day1'];
// Para 10s y 30s, agregamos desde Min1 usando ticks (polling de precio)
const SYNTHETIC_INTERVALS = { '10s': 10, '30s': 30 };

// ============================================================
// CHART SETUP
// ============================================================
const chartContainer = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartContainer, {
  layout: {
    background: { color: '#0d1117' },
    textColor: '#c9d1d9',
    fontFamily: 'inherit',
  },
  grid: {
    vertLines: { color: '#1c2128' },
    horzLines: { color: '#1c2128' },
  },
  rightPriceScale: { borderColor: '#30363d' },
  timeScale: {
    borderColor: '#30363d',
    timeVisible: true,
    secondsVisible: true,
  },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});

const candleSeries = chart.addCandlestickSeries({
  upColor: '#3fb950',
  downColor: '#f85149',
  borderUpColor: '#3fb950',
  borderDownColor: '#f85149',
  wickUpColor: '#3fb950',
  wickDownColor: '#f85149',
});

// Resize handler
window.addEventListener('resize', () => {
  chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
});
setTimeout(() => {
  chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
}, 50);

// ============================================================
// MEXC API - Datos históricos
// ============================================================
// Proxy CORS porque MEXC no permite llamadas directas desde browsers
const CORS_PROXY = 'https://corsproxy.io/?url=';

async function fetchMEXCKlines(symbol, interval, limit = 500) {
  // MEXC Futures API pública - sin auth
  const mexcUrl = `https://contract.mexc.com/api/v1/contract/kline/${symbol}?interval=${interval}&limit=${limit}`;
  const url = CORS_PROXY + encodeURIComponent(mexcUrl);
  try {
    const res = await fetch(url);
    const json = await res.json();
    if (!json.success) throw new Error('MEXC API error');
    const d = json.data;
    // Formato MEXC: { time:[], open:[], close:[], high:[], low:[], vol:[] }
    const candles = d.time.map((t, i) => ({
      time: t,
      open: parseFloat(d.open[i]),
      high: parseFloat(d.high[i]),
      low: parseFloat(d.low[i]),
      close: parseFloat(d.close[i]),
    }));
    return candles;
  } catch (e) {
    console.error('Fetch error:', e);
    showToast('Error cargando datos de MEXC');
    return [];
  }
}

async function fetchMEXCPrice(symbol) {
  const mexcUrl = `https://contract.mexc.com/api/v1/contract/ticker?symbol=${symbol}`;
  const url = CORS_PROXY + encodeURIComponent(mexcUrl);
  try {
    const res = await fetch(url);
    const json = await res.json();
    if (!json.success) return null;
    return parseFloat(json.data.lastPrice);
  } catch (e) {
    return null;
  }
}

// ============================================================
// VELAS SINTÉTICAS (10s, 30s) - construidas desde ticks
// ============================================================
let syntheticBuffer = {
  bucketStart: 0,
  open: 0, high: 0, low: 0, close: 0,
};

function getBucketStart(timestamp, seconds) {
  return Math.floor(timestamp / seconds) * seconds;
}

async function buildSyntheticHistory(symbol, intervalSec, count = 100) {
  // Para histórico sintético: tomamos klines de 1m y subdividimos por aproximación
  // (no es perfecto pero da contexto al chart antes de empezar a recibir ticks)
  const minutes = await fetchMEXCKlines(symbol, 'Min1', Math.ceil(count * intervalSec / 60) + 10);
  const synthetic = [];
  for (const m of minutes) {
    const subBuckets = 60 / intervalSec;
    // Interpolación lineal simple entre open y close del minuto
    for (let i = 0; i < subBuckets; i++) {
      const t = m.time + i * intervalSec;
      const ratio1 = i / subBuckets;
      const ratio2 = (i + 1) / subBuckets;
      const o = m.open + (m.close - m.open) * ratio1;
      const c = m.open + (m.close - m.open) * ratio2;
      synthetic.push({
        time: t,
        open: o,
        high: Math.max(o, c) + (m.high - Math.max(m.open, m.close)) * 0.3,
        low: Math.min(o, c) - (Math.min(m.open, m.close) - m.low) * 0.3,
        close: c,
      });
    }
  }
  return synthetic.slice(-count);
}

// ============================================================
// CARGAR DATOS
// ============================================================
async function loadChart() {
  stopPolling();
  setStatus('LOADING', 'live');

  let candles;
  if (SYNTHETIC_INTERVALS[state.interval]) {
    candles = await buildSyntheticHistory(state.symbol, SYNTHETIC_INTERVALS[state.interval], 200);
  } else {
    candles = await fetchMEXCKlines(state.symbol, state.interval, 500);
  }

  // Sanitizar: ordenar cronológicamente y eliminar duplicados
  candles.sort((a, b) => a.time - b.time);
  const dedup = [];
  let lastT = -1;
  for (const c of candles) {
    if (c.time !== lastT) {
      dedup.push(c);
      lastT = c.time;
    }
  }
  candles = dedup;

  state.candles = candles;
  state.liveCandles = [...candles];
  candleSeries.setData(candles);
  chart.timeScale().fitContent();

  if (candles.length > 0) {
    state.lastPrice = candles[candles.length - 1].close;
    updatePriceDisplay(state.lastPrice);
  }

  if (!state.isReplay && !state.isFrozen) {
    startPolling();
  }
  setStatus('LIVE', 'live');
}

// ============================================================
// POLLING - actualización en vivo
// ============================================================
function startPolling() {
  stopPolling();
  const intervalMs = SYNTHETIC_INTERVALS[state.interval] ? 2000 : 5000;
  state.pollTimer = setInterval(tick, intervalMs);
  tick();
}

function stopPolling() {
  if (state.pollTimer) {
    clearInterval(state.pollTimer);
    state.pollTimer = null;
  }
}

async function tick() {
  if (state.isFrozen || state.isReplay) return;

  const price = await fetchMEXCPrice(state.symbol);
  if (price == null) return;

  state.prevPrice = state.lastPrice;
  state.lastPrice = price;
  updatePriceDisplay(price);

  const now = Math.floor(Date.now() / 1000);

  if (SYNTHETIC_INTERVALS[state.interval]) {
    // Construir velas sintéticas en tiempo real
    const sec = SYNTHETIC_INTERVALS[state.interval];
    const bucketStart = getBucketStart(now, sec);
    const last = state.liveCandles[state.liveCandles.length - 1];

    if (last && last.time === bucketStart) {
      last.high = Math.max(last.high, price);
      last.low = Math.min(last.low, price);
      last.close = price;
      try { candleSeries.update(last); } catch(e) { console.warn('update skip', e.message); }
    } else if (!last || bucketStart > last.time) {
      const newCandle = { time: bucketStart, open: price, high: price, low: price, close: price };
      state.liveCandles.push(newCandle);
      try { candleSeries.update(newCandle); } catch(e) { console.warn('update skip', e.message); }
    }
  } else {
    // Para TFs nativos: fetch de las últimas velas y solo actualizar las más nuevas
    const recent = await fetchMEXCKlines(state.symbol, state.interval, 3);
    if (recent.length === 0) return;

    // Ordenar cronológicamente
    recent.sort((a, b) => a.time - b.time);

    const lastTimeInChart = state.liveCandles.length > 0
      ? state.liveCandles[state.liveCandles.length - 1].time
      : 0;

    for (const c of recent) {
      if (c.time < lastTimeInChart) {
        // Vela vieja, ignorar
        continue;
      } else if (c.time === lastTimeInChart) {
        // Actualizar última vela (sigue formándose)
        const existing = state.liveCandles[state.liveCandles.length - 1];
        Object.assign(existing, c);
        try { candleSeries.update(c); } catch(e) { console.warn('update skip', e.message); }
      } else {
        // Vela nueva, agregar
        state.liveCandles.push(c);
        try { candleSeries.update(c); } catch(e) { console.warn('update skip', e.message); }
      }
    }
  }
}

// ============================================================
// FREEZE MODE
// ============================================================
function toggleFreeze() {
  if (state.isReplay) {
    showToast('Sal del modo Replay primero');
    return;
  }
  state.isFrozen = !state.isFrozen;
  const btn = document.getElementById('freezeBtn');
  btn.classList.toggle('active', state.isFrozen);

  if (state.isFrozen) {
    stopPolling();
    setStatus('FROZEN', 'frozen');
    showToast('❄ Precio congelado — cambia de TF para refinar entrada');
  } else {
    startPolling();
    setStatus('LIVE', 'live');
    showToast('Live reanudado');
  }
}

// ============================================================
// BAR REPLAY
// ============================================================
async function toggleReplay() {
  if (state.isFrozen) {
    showToast('Sal del modo Freeze primero');
    return;
  }
  state.isReplay = !state.isReplay;
  const btn = document.getElementById('replayBtn');
  const controls = document.getElementById('replayControls');
  btn.classList.toggle('active', state.isReplay);
  controls.classList.toggle('visible', state.isReplay);

  if (state.isReplay) {
    stopPolling();
    // Cargar histórico extendido para replay (más velas atrás)
    setStatus('LOADING', 'replay');
    let fullHistory;
    if (SYNTHETIC_INTERVALS[state.interval]) {
      fullHistory = await buildSyntheticHistory(state.symbol, SYNTHETIC_INTERVALS[state.interval], 1000);
    } else {
      fullHistory = await fetchMEXCKlines(state.symbol, state.interval, 1000);
    }
    state.candles = fullHistory;
    // Empezar mostrando los primeros 50% del histórico
    state.replayIndex = Math.floor(fullHistory.length * 0.5);
    renderReplay();
    setStatus('REPLAY', 'replay');
    showToast('▶ Replay activado — click play o step para avanzar');
  } else {
    stopReplayTimer();
    setStatus('LIVE', 'live');
    loadChart();
  }
}

function renderReplay() {
  const visible = state.candles.slice(0, state.replayIndex + 1);
  candleSeries.setData(visible);
  if (visible.length > 0) {
    const last = visible[visible.length - 1];
    state.lastPrice = last.close;
    updatePriceDisplay(last.close);
    const date = new Date(last.time * 1000);
    document.getElementById('replayInfo').textContent =
      `Vela ${state.replayIndex + 1}/${state.candles.length} · ${date.toLocaleString('es-CL')}`;
  }
}

function stepReplay() {
  if (state.replayIndex < state.candles.length - 1) {
    state.replayIndex++;
    renderReplay();
  } else {
    stopReplayTimer();
    showToast('Fin del histórico');
  }
}

function playReplay() {
  if (state.replayTimer) {
    stopReplayTimer();
  } else {
    document.getElementById('replayPlay').textContent = '⏸';
    state.replayTimer = setInterval(stepReplay, state.replaySpeed);
  }
}

function stopReplayTimer() {
  if (state.replayTimer) {
    clearInterval(state.replayTimer);
    state.replayTimer = null;
    document.getElementById('replayPlay').textContent = '▶';
  }
}

// ============================================================
// UI HELPERS
// ============================================================
function updatePriceDisplay(price) {
  const el = document.getElementById('priceDisplay');
  const decimals = price < 1 ? 5 : price < 100 ? 3 : 2;
  el.textContent = price.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  el.classList.remove('up', 'down');
  if (price > state.prevPrice) el.classList.add('up');
  else if (price < state.prevPrice) el.classList.add('down');
}

function setStatus(text, type) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('statusDot');
  dot.classList.remove('frozen', 'replay');
  if (type === 'frozen') dot.classList.add('frozen');
  if (type === 'replay') dot.classList.add('replay');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('symbol').addEventListener('change', (e) => {
  state.symbol = e.target.value;
  if (state.isReplay) {
    toggleReplay(); // salir de replay
  }
  loadChart();
});

document.querySelectorAll('.tf-group button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tf-group button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.interval = btn.dataset.tf;
    if (state.isReplay) {
      toggleReplay();
    } else if (state.isFrozen) {
      // En freeze, solo cambiamos el TF pero no recargamos en vivo
      loadChart().then(() => {
        stopPolling();
        setStatus('FROZEN', 'frozen');
      });
    } else {
      loadChart();
    }
  });
});

document.getElementById('freezeBtn').addEventListener('click', toggleFreeze);
document.getElementById('replayBtn').addEventListener('click', toggleReplay);
document.getElementById('replayPlay').addEventListener('click', playReplay);
document.getElementById('replayStep').addEventListener('click', stepReplay);
document.getElementById('replayReset').addEventListener('click', () => {
  stopReplayTimer();
  state.replayIndex = Math.floor(state.candles.length * 0.5);
  renderReplay();
});
document.getElementById('replayExit').addEventListener('click', toggleReplay);

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.replaySpeed = parseInt(btn.dataset.speed);
    if (state.replayTimer) {
      stopReplayTimer();
      playReplay();
    }
  });
});

// ============================================================
// INIT
// ============================================================
loadChart();
</script>
</body>
</html>
